name: Core verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Python 3.13 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
      - name: Install locked development environment
        run: uv sync --locked --python 3.13
      - name: Core tests
        run: uv run --no-sync python -m pytest tests/
      - name: License scope audit
        run: uv run --no-sync python scripts/auditar_licencas.py
      - name: Portable source manifest
        run: uv run --no-sync python scripts/validar_manifesto.py
      - name: Strict machine audit
        run: uv run --no-sync python -m article_machine machine audit --workspace-root . --strict
      - name: Skill provenance
        run: uv run --no-sync python -m article_machine skills audit --strict --provenance
      - name: Verify Windows installer
        if: runner.os == 'Windows'
        run: .\instalar.ps1 -VerifyOnly
      - name: Verify Unix installer
        if: runner.os == 'Linux'
        run: bash instalar.sh --verify-only
