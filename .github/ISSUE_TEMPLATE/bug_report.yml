name: Bug report
description: Report a reproducible runtime or documentation problem without private data.
body:
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Repository commit, OS, Python/uv versions and command used. No credentials or account details.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal synthetic reproduction
      description: Steps, expected behavior and actual behavior. Use synthetic inputs; redact secrets and private paths.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Relevant error or check result
      description: Share only the short relevant excerpt. Do not attach patient data, restricted papers or private manuscripts.
