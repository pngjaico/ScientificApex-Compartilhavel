preferred_runner: local-r
fallback_runner: manual-export
gpu_required: false
languages:
- r
- python
notes: Modelo de estatistica, visualizacao cientifica (300 dpi ragg / SVG svglite) e tabelas (gtsummary, gt, flextable) em R 4.6.1 sincronizado via renv 1.3.1.
environments:
  r:
    manager: renv
    version: 4.6.1
    lockfile: ambiente/renv.lock
    packages:
    - ggplot2
    - patchwork
    - ggpubr
    - survminer
    - ggsurvfit
    - tidycmprsk
    - ragg
    - svglite
    - plotly
    - gtsummary
    - gt
    - flextable
    - officer
    - PRISMA2020
    - DiagrammeR
    - DiagrammeRsvg
    - rsvg
    - robvis
    - metafor
    - netmeta
    - cobalt
    - MatchIt
    - WeightIt
