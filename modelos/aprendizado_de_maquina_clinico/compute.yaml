contract_version: 2
project_type: prediction-model
lane: evidence-writing
required_plugins: []
r:
  required: false
  version: 4.6.1
  runner: Rscript
  package_manager: renv
  package_manager_version: 1.3.1
  lockfile: null
  timeout_seconds: 900
  allowed_directories:
  - analysis
  - scripts
  packages:
  - tidymodels
  - probably
  - dcurves
  - xgboost
  - lightgbm
  - glmnet
  - ranger
  - pROC
  - rms
  - DALEX
  - DALEXtra
  - ingredients
  - iBreakDown
  - pdp
  - kernelshap
  - shapviz
  - mice
  - gtsummary
  - gt
  - flextable
  - ggplot2
  - patchwork
  - ragg
  - svglite
python:
  required: true
  version: '3.13'
  runner: .venv/Scripts/python.exe
  package_manager: uv
  package_manager_version: 0.11.31
  lockfile: uv.lock
  timeout_seconds: 600
  allowed_directories:
  - analysis
  - scripts
  packages:
  - scikit-learn
  - pandas
  - numpy
  - scipy
  - statsmodels
  - xgboost
  - lightgbm
  - optuna
  - mapie
  - lifelines
  - shap
  - pandera
  - matplotlib
  - seaborn
  - plotly
  - openpyxl
  skills:
  - statistical-analysis
browser:
  required: false
  version: 1.61.1
  runner: tools/playwright/node_modules/.bin/playwright.cmd
  package_manager: npm
  package_manager_version: 11.17.0
  lockfile: null
  timeout_seconds: 180
  allowed_directories:
  - analysis
  - scripts
