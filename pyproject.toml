[project]
name = "article-machine"
version = "0.3.0"
description = "Scientific OS for agent-native research, evidence synthesis, and computational discovery."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "ScientificApex contributors"}]

dependencies = [
    "PyYAML==6.0.3",
    "graphifyy==0.9.23",
]

[project.optional-dependencies]
office = [
    "python-docx==1.2.0",
]
analysis = [
    "lifelines>=0.30.3",
    "mapie>=1.6.0",
    "pandera>=0.35.0",
    "pdfplumber>=0.11.10",
]

[project.scripts]
article-machine = "article_machine.cli:main"

[project.urls]
Repository = "https://github.com/pngjaico/ScientificApex-Compartilhavel"
Issues = "https://github.com/pngjaico/ScientificApex-Compartilhavel/issues"
Documentation = "https://github.com/pngjaico/ScientificApex-Compartilhavel/tree/main/docs"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "cyclonedx-bom==7.3.0",
  "detect-secrets>=1.5.0",
  "mypy==1.20.2",
  "pip-audit==2.10.1",
  "pre-commit>=4.7.0",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.15.22",
  "types-PyYAML==6.0.12.20260518",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["article_machine"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
  "article_machine.agent_skills",
  "article_machine.analysis",
  "article_machine.benchmarks",
  "article_machine.cli",
  "article_machine.evidence",
  "article_machine.projects",
  "article_machine.review",
  "article_machine.zero_trust",
]
disallow_untyped_defs = false
disallow_any_generics = false
warn_return_any = false
